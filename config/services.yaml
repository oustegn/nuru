parameters:
    env(MAILER_DSN): 'null://null'
    env(MAILER_FROM): 'no-reply@example.invalid'
    env(APP_PUBLIC_ORIGIN): 'http://127.0.0.1:3000'
    env(SESSION_SECURE): '0'
    env(SESSION_SAMESITE): 'lax'
    env(CATALOG_SOURCE): 'demo'
    env(DATABASE_URL): 'mysql://nuru_app:change-me@127.0.0.1:3306/nuru?serverVersion=8.0.0&charset=utf8mb4'

services:
    _defaults:
        autowire: true
        autoconfigure: true
    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Entity/'
    App\Service\Catalog:
        arguments:
            $source: '%env(CATALOG_SOURCE)%'
    App\Service\EmailVerificationService:
        arguments:
            $publicOrigin: '%env(APP_PUBLIC_ORIGIN)%'
            $fromAddress: '%env(MAILER_FROM)%'
            $mailerDsn: '%env(MAILER_DSN)%'
