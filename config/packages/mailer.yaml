framework:
    mailer:
        dsn: '%env(MAILER_DSN)%'
    rate_limiter:
        registration_ip:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
        verification_resend_ip:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
        verification_resend_email:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
